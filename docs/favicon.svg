<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bstack">
  <!-- 跟站上左上角那顆 bs 標記同一組值：底色 accent、字色 accent-ink、
       Newsreader 600、圓角是邊長的 7.5%（40px 見方配 3px，換算 64 見方就是 4.8）。

       字型鏈以 Newsreader 起頭但本機幾乎不會有，favicon 讀不到網頁字型，
       所以退到 Georgia / Times；兩者跟 Newsreader 同屬過渡期襯線，16px 下看不出差別。

       註解裡不要出現連續兩個減號，XML 會當成註解結束、整份解析失敗。 -->
  <style>
    .bg { fill: #C3352D; }
    .fg { fill: #FEFDFB; }
    /* 站上那顆標記會跟著主題換色，favicon 跟著換才是同一顆 */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ED7761; }
      .fg { fill: #110C09; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="4.8"/>
  <text class="fg" x="32" y="43.5"
        text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', 'Noto Serif TC', serif"
        font-weight="600" font-size="28" letter-spacing="-0.6">bs</text>
</svg>
