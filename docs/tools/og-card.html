<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>bstack OG 卡原稿（產圖用，站上沒有任何頁連到這裡）</title>
  <!--
    這是 docs/og.png 的原稿。重產步驟（本機 Playwright MCP 擋 file://，用 node 起個靜態伺服器供 docs/）：
      1. 用 Playwright 開這個檔（字型走 Google Fonts 要連網）
      2. 等 document.fonts.ready，確認 Instrument Sans / Noto Sans TC / JetBrains Mono 都 loaded
      3. 對 .card 元素截圖、scale=css → 得到 1200×630 的 PNG，存到 docs/og.png
      4. node docs/tools/docs-site-contract.mjs → C20d 綠

    **色值為什麼寫死、不 var() 到別的檔**：2026-09-08 的 void 改版把樣式全部收進
    index.html / flow.html 的 inline <style>，站上不再有共用的外部 stylesheet 可以連
    （舊版連的 ../css/styles.css 已隨改版刪除）。所以這裡的 token 是**手抄自
    docs/index.html 的 :root[data-theme="dark"] 區塊**，改配色要兩邊一起改，
    契約 C20e 比對這六個值、漂了會紅。

    強制 data-theme="dark"：OG 圖不跟系統主題。選 dark 是因為這版的識別就是黑底＋
    #7CF5A6 那道綠，light 版縮到社群預覽卡的尺寸幾乎只剩白底。

    換圖注意：LINE / FB / Slack 按網址快取預覽圖，換了圖要改檔名或在兩頁的 og:image
    加 ?v=N，否則舊圖會掛很久。本次改版已掛 ?v=2。
    og:image 寫死 https://fujiei22.github.io/bstack/，加 CNAME 時要一併改。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
  <style>
    /* 抄自 docs/index.html 的 :root[data-theme="dark"]，見上面註解 */
    :root {
      --bg: #000000;
      --line: #232326;
      --ink: #FAFAFA;
      --ink-2: #A3A3A8;
      --ink-3: #8B8B92;
      --accent: #7CF5A6;
    }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Instrument Sans", "Noto Sans TC", system-ui, sans-serif;
      letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative; width: 1200px; height: 630px; padding: 84px;
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--bg);
    }
    /* 左邊界那道直線：landing 的 --rail 直排 header 在 OG 尺寸下的等比放大 */
    .card::before {
      content: ""; position: absolute; left: 40px; top: 84px; bottom: 84px;
      width: 1px; background: var(--line);
    }
    .top { display: flex; align-items: center; gap: 20px; }
    /* 標記＝docs/brand/bstack-mark.svg 的三個 rect，24 → 72（×3）。
       這裡內嵌而非 <img>：mark.svg 的兩塊用 currentColor，透過 <img> 載入拿不到外面的色。 */
    .mk { display: block; }
    .kicker {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 20px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-3);
    }
    .name {
      margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500; font-size: 104px; line-height: 1; letter-spacing: -0.04em;
    }
    .tag {
      /* 400 而非 landing 那邊的 300：字型 URL 只要了 400;500;600，用 300 會讓「Claude Code」
         那幾個拉丁字被瀏覽器合成細體，跟後面 Noto Sans TC 的中文對不齊 */
      margin: 24px 0 0; font-size: 38px; line-height: 1.4; font-weight: 400;
      color: var(--ink-2);
    }
    .bottom { display: flex; align-items: baseline; justify-content: space-between; }
    .url {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 22px; letter-spacing: 0.04em; color: var(--ink-3);
    }
    .accent { color: var(--accent); }
    .rule { position: absolute; left: 84px; right: 84px; bottom: 150px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <svg class="mk" width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="7.5" height="18" fill="#FAFAFA"></rect>
        <rect x="13.5" y="3" width="7.5" height="7.5" fill="#7CF5A6"></rect>
        <rect x="13.5" y="13.5" width="7.5" height="7.5" fill="#FAFAFA"></rect>
      </svg>
      <span class="kicker">Claude Code Plugin · 繁中 · MIT</span>
    </div>
    <div>
      <h1 class="name">bstack</h1>
      <p class="tag">Claude Code 開發流程包</p>
    </div>
    <div class="rule"></div>
    <div class="bottom">
      <span class="url">fujiei22.github.io/bstack</span>
      <span class="url accent">/devwork</span>
    </div>
  </div>
</body>
</html>
